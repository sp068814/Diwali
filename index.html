<!DOCTYPE html>
<html lang="hi" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diwali Cinematic Post Generator 🎆</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Canvas Confetti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <!-- HTML2Canvas for Image Download -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;900&display=swap');
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #06040a;
            background-image: radial-gradient(circle at 50% 30%, #220f38 0%, #06040a 80%);
        }
        .glow-gold {
            box-shadow: 0 0 25px rgba(255, 215, 0, 0.5), inset 0 0 15px rgba(255, 153, 0, 0.3);
        }
    </style>
</head>
<body class="text-white min-h-screen flex flex-col items-center justify-center p-3 sm:p-6 overflow-x-hidden">

    <div class="max-w-md w-full bg-slate-900/90 border border-amber-500/40 p-5 sm:p-6 rounded-3xl shadow-[0_0_50px_rgba(255,153,0,0.25)] text-center relative backdrop-blur-md my-2">
        
        <!-- Header -->
        <div class="inline-block bg-amber-500/10 border border-amber-500/30 px-3 py-1 rounded-full text-[11px] text-amber-300 font-bold mb-2 animate-pulse">
            🪔 Viral Diwali Trend 2026 🪔
        </div>
        <h1 class="text-2xl sm:text-3xl font-black text-transparent bg-clip-text bg-gradient-to-r from-yellow-300 via-amber-400 to-orange-500 drop-shadow mb-1">
            Diwali Wish Maker
        </h1>
        <p class="text-xs text-gray-400 mb-4">Photo lagayein, Naam likhein aur Rocket phodein!</p>
        
        <!-- Controls Bar -->
        <div class="space-y-3 mb-4 text-left">
            <!-- Name Input Field -->
            <div>
                <label class="block text-xs font-semibold text-amber-400 mb-1">Apna Naam Likhein (Your Name):</label>
                <input type="text" id="yourNameInput" placeholder="Apna naam likhein (e.g. Rahul)" 
                       class="w-full bg-slate-950/80 border border-amber-500/30 rounded-xl px-3.5 py-2 text-xs text-amber-200 placeholder-gray-500 focus:outline-none focus:border-amber-400 transition">
            </div>

            <!-- Photo Upload Box -->
            <div>
                <label class="block text-xs font-semibold text-amber-400 mb-1">Apni Photo Select Karein:</label>
                <label for="imageUpload" class="flex items-center justify-between w-full bg-slate-950/80 border border-amber-500/30 rounded-xl px-3.5 py-2 text-xs text-gray-300 cursor-pointer hover:border-amber-400 transition">
                    <span id="file-name-text" class="truncate max-w-[200px]">Choose photo...</span>
                    <span class="bg-gradient-to-r from-amber-500 to-orange-600 text-slate-950 font-bold px-3 py-1 rounded-lg text-[11px]">
                        <i class="fas fa-camera mr-1"></i> Upload
                    </span>
                </label>
                <input type="file" id="imageUpload" accept="image/*" class="hidden">
            </div>
        </div>

        <!-- POST PREVIEW CARD -->
        <div id="preview-card" class="relative w-full aspect-square bg-slate-950 rounded-2xl overflow-hidden border-2 border-amber-500/60 shadow-2xl flex flex-col items-center justify-between p-3 select-none mb-4">
            
            <!-- Spark & Blast Canvas Effect Layer -->
            <canvas id="sparkCanvas" class="absolute inset-0 w-full h-full pointer-events-none z-20"></canvas>

            <!-- Card Top Header -->
            <div class="relative z-10 w-full text-center pt-1">
                <div class="text-amber-300 font-bold text-sm tracking-widest flex items-center justify-center gap-1.5">
                    <span>✨ HAPPY DIWALI ✨</span>
                </div>
                <div class="text-[10px] text-amber-200/70 uppercase">Shubh Deepawali</div>
            </div>

            <!-- Circular Photo Container -->
            <div class="relative z-10 my-auto">
                <!-- Glowing Outer Aura Ring -->
                <div class="relative w-40 h-40 sm:w-48 sm:h-48 rounded-full p-1 bg-gradient-to-tr from-yellow-300 via-amber-500 to-red-600 shadow-[0_0_30px_rgba(255,153,0,0.6)] flex items-center justify-center">
                    
                    <!-- Circular Image Frame -->
                    <div id="photoCircle" class="w-full h-full rounded-full overflow-hidden bg-slate-900 border-2 border-amber-300 relative flex items-center justify-center">
                        
                        <!-- Placeholder Icon / User Photo -->
                        <div id="placeholderUI" class="flex flex-col items-center text-gray-500 text-xs p-2">
                            <i class="fas fa-image text-3xl mb-1 text-amber-500/50"></i>
                            <span>Photo Upload Karein</span>
                        </div>

                        <img id="userPhoto" class="hidden w-full h-full object-cover rounded-full" alt="Uploaded Photo">
                        
                        <!-- Frame Tag -->
                        <div class="absolute bottom-1 bg-black/70 backdrop-blur-sm text-amber-300 text-[9px] font-bold px-2 py-0.5 rounded-full border border-amber-400/40">
                            🪔 Shubh Labh
                        </div>
                    </div>

                </div>
                <!-- Floating Diyas -->
                <div class="absolute -bottom-1 -left-2 text-lg filter drop-shadow">🪔</div>
                <div class="absolute -bottom-1 -right-2 text-lg filter drop-shadow">🪔</div>
            </div>

            <!-- Card Bottom Name Badge -->
            <div class="relative z-10 w-full pb-1 text-center">
                <div class="inline-block bg-slate-900/90 border border-amber-500/50 px-4 py-1 rounded-xl text-xs text-amber-200 font-medium">
                    Wish You From: <span id="displayName" class="font-bold text-amber-400">Your Name</span>
                </div>
            </div>

            <!-- INTERACTIVE ROCKET BUTTONS -->
            <button onclick="launchRocket(event, this)" class="absolute top-8 left-3 z-30 bg-red-600/90 hover:bg-red-500 text-white p-2 rounded-full text-xs shadow-lg animate-bounce cursor-pointer">
                🚀
            </button>
            <button onclick="launchRocket(event, this)" class="absolute top-8 right-3 z-30 bg-amber-600/90 hover:bg-amber-500 text-white p-2 rounded-full text-xs shadow-lg animate-bounce cursor-pointer" style="animation-delay: 0.3s;">
                🚀
            </button>
            <button onclick="launchRocket(event, this)" class="absolute bottom-12 right-3 z-30 bg-orange-600/90 hover:bg-orange-500 text-white p-2 rounded-full text-xs shadow-lg animate-pulse cursor-pointer">
                🧨
            </button>

        </div>

        <!-- ACTION BUTTONS -->
        <div class="space-y-2.5">
            <!-- Blast All Rockets -->
            <button onclick="triggerGrandBlast()" class="w-full bg-gradient-to-r from-red-600 via-orange-500 to-amber-500 hover:opacity-95 text-white font-bold py-2.5 px-4 rounded-xl text-xs sm:text-sm transition shadow-lg flex items-center justify-center gap-2">
                💥 Sabhi Rocket Phodo & Blast Sound Suno!
            </button>

            <!-- Download Image Button -->
            <button onclick="downloadPostImage()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-2.5 px-4 rounded-xl text-xs sm:text-sm transition shadow-lg flex items-center justify-center gap-2">
                📥 Download Post Image (Facebook Post ke Liye)
            </button>

            <!-- Facebook Share Link -->
            <button onclick="shareToFacebook()" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-2.5 px-4 rounded-xl text-xs sm:text-sm transition shadow-lg flex items-center justify-center gap-2">
                <i class="fab fa-facebook-f"></i> Share Website Link (Try Now)
            </button>
        </div>

    </div>

    <!-- JAVASCRIPT LOGIC -->
    <script>
        const imageUpload = document.getElementById('imageUpload');
        const userPhoto = document.getElementById('userPhoto');
        const placeholderUI = document.getElementById('placeholderUI');
        const fileNameText = document.getElementById('file-name-text');
        const yourNameInput = document.getElementById('yourNameInput');
        const displayName = document.getElementById('displayName');

        // 1. PHOTO PREVIEW FIX
        imageUpload.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                fileNameText.textContent = file.name;
                
                // Use ObjectURL for instant rendering without FileReader delay
                const objectUrl = URL.createObjectURL(file);
                userPhoto.src = objectUrl;
                
                // Toggle visibility
                placeholderUI.classList.add('hidden');
                userPhoto.classList.remove('hidden');

                // Trigger celebration sparks
                triggerGrandBlast();
            }
        });

        // 2. NAME LIVE INPUT SYNC
        yourNameInput.addEventListener('input', function(e) {
            const val = e.target.value.trim();
            displayName.textContent = val !== "" ? val : "Your Name";
        });

        // 3. SYNTHESIZED AUDIO SOUND FX (Web Audio API)
        let audioCtx = null;

        function playExplosionSound() {
            try {
                if (!audioCtx) {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                }
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }

                const bufferSize = audioCtx.sampleRate * 0.4;
                const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) {
                    data[i] = Math.random() * 2 - 1;
                }

                const noise = audioCtx.createBufferSource();
                noise.buffer = buffer;

                const filter = audioCtx.createBiquadFilter();
                filter.type = 'lowpass';
                filter.frequency.setValueAtTime(800, audioCtx.currentTime);
                filter.frequency.exponentialRampToValueAtTime(30, audioCtx.currentTime + 0.35);

                const gain = audioCtx.createGain();
                gain.gain.setValueAtTime(1, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.35);

                noise.connect(filter);
                filter.connect(gain);
                gain.connect(audioCtx.destination);

                noise.start();
            } catch (err) {
                console.log("Audio play prevented");
            }
        }

        // 4. CANVAS SPARK / CHINGARI ENGINE
        const canvas = document.getElementById('sparkCanvas');
        const ctx = canvas.getContext('2d');
        let sparks = [];

        function resizeCanvas() {
            const rect = canvas.getBoundingClientRect();
            canvas.width = rect.width;
            canvas.height = rect.height;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        class Spark {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.size = Math.random() * 3 + 1;
                this.speedX = (Math.random() - 0.5) * 6;
                this.speedY = (Math.random() - 0.5) * 6 - 2;
                this.color = `hsl(${Math.random() * 50 + 15}, 100%, 60%)`;
                this.opacity = 1;
                this.gravity = 0.08;
                this.friction = 0.98;
            }
            update() {
                this.speedY += this.gravity;
                this.speedX *= this.friction;
                this.speedY *= this.friction;
                this.x += this.speedX;
                this.y += this.speedY;
                this.opacity -= 0.015;
            }
            draw() {
                ctx.save();
                ctx.globalAlpha = Math.max(this.opacity, 0);
                ctx.fillStyle = this.color;
                ctx.shadowBlur = 8;
                ctx.shadowColor = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        function createSparks(x, y, count = 40) {
            for (let i = 0; i < count; i++) {
                sparks.push(new Spark(x, y));
            }
        }

        function animateSparks() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for (let i = sparks.length - 1; i >= 0; i--) {
                sparks[i].update();
                if (sparks[i].opacity > 0) {
                    sparks[i].draw();
                } else {
                    sparks.splice(i, 1);
                }
            }
            requestAnimationFrame(animateSparks);
        }
        animateSparks();

        // 5. ROCKET LAUNCH CONTROLLER
        function launchRocket(event, btn) {
            playExplosionSound();

            const cardRect = document.getElementById('preview-card').getBoundingClientRect();
            const btnRect = btn.getBoundingClientRect();

            const sparkX = (btnRect.left + btnRect.width / 2) - cardRect.left;
            const sparkY = (btnRect.top + btnRect.height / 2) - cardRect.top;

            createSparks(sparkX, sparkY, 50);

            // Screen confetti burst
            const winX = (btnRect.left + btnRect.width / 2) / window.innerWidth;
            const winY = (btnRect.top + btnRect.height / 2) / window.innerHeight;

            confetti({
                particleCount: 50,
                spread: 70,
                origin: { x: winX, y: winY },
                colors: ['#ff0000', '#ffa500', '#ffff00', '#ff69b4']
            });

            btn.style.transform = 'scale(1.4)';
            setTimeout(() => { btn.style.transform = 'scale(1)'; }, 200);
        }

        function triggerGrandBlast() {
            playExplosionSound();
            const cardRect = document.getElementById('preview-card').getBoundingClientRect();
            createSparks(cardRect.width / 2, cardRect.height / 2, 120);

            confetti({
                particleCount: 150,
                spread: 100,
                origin: { y: 0.6 },
                colors: ['#ff0000', '#ffa500', '#ffff00', '#00ff00', '#00ffff']
            });
        }

        // 6. DOWNLOAD POST IMAGE FOR FACEBOOK
        function downloadPostImage() {
            const previewCard = document.getElementById('preview-card');

            html2canvas(previewCard, {
                useCORS: true,
                scale: 2,
                backgroundColor: '#06040a',
                ignoreElements: (el) => el.tagName === 'BUTTON' || el.id === 'sparkCanvas'
            }).then(exportedCanvas => {
                const link = document.createElement('a');
                link.download = `Diwali_Wish_${yourNameInput.value.trim() || 'Post'}.png`;
                link.href = exportedCanvas.toDataURL('image/png');
                link.click();
            });
        }

        // 7. FACEBOOK VIRAL SHARE LINK
        function shareToFacebook() {
            const baseUrl = window.location.href.split('?')[0];
            const tryNowUrl = `${baseUrl}?tryNow=true`;
            const fbShareUrl = `https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent(tryNowUrl)}`;
            window.open(fbShareUrl, '_blank', 'width=600,height=500');
        }
    </script>
</body>
</html>
