
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Diwali 2026 Celebration</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  overflow:hidden;
  background:#02000d;
  font-family:Georgia,serif;
  color:white;
}
canvas{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
}
.content{
  position:absolute;
  top:35%;
  width:100%;
  text-align:center;
  pointer-events:none;
  padding:10px;
}
h1{
  font-size:clamp(38px,9vw,85px);
  color:#ffd76a;
  text-shadow:0 0 12px #ff8c00,0 0 35px #ff4500,
  0 0 65px #ffb000;
  animation:glow 2s infinite alternate;
}
.subtitle{
  font-size:clamp(17px,4vw,27px);
  color:#fff1bd;
  margin-top:15px;
  letter-spacing:4px;
  text-shadow:0 0 15px orange;
}
@keyframes glow{
  from{filter:brightness(.8)}
  to{filter:brightness(1.5)}
}
.diyas{
  position:absolute;
  bottom:8%;
  width:100%;
  display:flex;
  justify-content:space-evenly;
  pointer-events:none;
}
.diya{
  font-size:clamp(35px,7vw,65px);
  filter:drop-shadow(0 0 15px orange);
  animation:flicker .6s infinite alternate;
}
@keyframes flicker{
  from{transform:scale(.94);filter:brightness(.8)}
  to{transform:scale(1.08);filter:brightness(1.5)}
}
#start{
  position:absolute;
  bottom:3%;
  left:50%;
  transform:translateX(-50%);
  padding:12px 25px;
  border:1px solid #ffce60;
  border-radius:30px;
  background:#7a2600;
  color:#fff;
  font-size:15px;
  z-index:5;
  box-shadow:0 0 20px orange;
}
</style>
</head>

<body>
<canvas id="sky"></canvas>

<div class="content">
  <h1>HAPPY DIWALI</h1>
  <div class="subtitle">✨ 2026 ✨</div>
  <div style="margin-top:22px;color:#ffe3a0;font-size:17px">
    May Your Life Shine Like A Million Diyas
  </div>
</div>

<div class="diyas">
  <div class="diya">🪔</div>
  <div class="diya">🪔</div>
  <div class="diya">🪔</div>
  <div class="diya">🪔</div>
  <div class="diya">🪔</div>
</div>

<button id="start">🔊 START CELEBRATION</button>

<script>
const canvas=document.getElementById("sky");
const ctx=canvas.getContext("2d");

let W,H,rockets=[],particles=[],stars=[];
let audio,playing=false;

function resize(){
  W=canvas.width=innerWidth;
  H=canvas.height=innerHeight;
  stars=Array.from({length:100},()=>({
    x:Math.random()*W,
    y:Math.random()*H,
    r:Math.random()*1.8,
    a:Math.random()
  }));
}
resize();
onresize=resize;

function launch(x=Math.random()*W,y=H){
  rockets.push({
    x,y,
    tx:W*.15+Math.random()*W*.7,
    ty:H*.08+Math.random()*H*.45,
    speed:5+Math.random()*3,
    hue:Math.random()*360
  });
}

function burst(x,y,hue){
  for(let i=0;i<100;i++){
    let angle=Math.random()*Math.PI*2;
    let speed=Math.random()*6+1;
    particles.push({
      x,y,
      vx:Math.cos(angle)*speed,
      vy:Math.sin(angle)*speed,
      life:1,
      hue,
      size:Math.random()*3+1
    });
  }
  soundBurst();
}

function draw(){
  ctx.fillStyle="rgba(2,0,13,.20)";
  ctx.fillRect(0,0,W,H);

  stars.forEach(s=>{
    ctx.fillStyle=`rgba(255,255,220,${s.a})`;
    ctx.beginPath();
    ctx.arc(s.x,s.y,s.r,0,Math.PI*2);
    ctx.fill();
    s.a=Math.random()*.9;
  });

  rockets.forEach((r,i)=>{
    let dx=r.tx-r.x,dy=r.ty-r.y;
    let d=Math.hypot(dx,dy);
    if(d<9){
      burst(r.x,r.y,r.hue);
      rockets.splice(i,1);
    }else{
      r.x+=dx/d*r.speed;
      r.y+=dy/d*r.speed;
      ctx.fillStyle="#fff7ad";
      ctx.shadowBlur=15;
      ctx.shadowColor="#ffae00";
      ctx.beginPath();
      ctx.arc(r.x,r.y,3,0,Math.PI*2);
      ctx.fill();
      ctx.shadowBlur=0;
    }
  });

  particles.forEach((p,i)=>{
    p.x+=p.vx;
    p.y+=p.vy;
    p.vy+=.035;
    p.vx*=.985;
    p.life-=.012;

    ctx.globalAlpha=Math.max(0,p.life);
    ctx.fillStyle=`hsl(${p.hue},100%,65%)`;
    ctx.shadowBlur=12;
    ctx.shadowColor=`hsl(${p.hue},100%,60%)`;
    ctx.beginPath();
    ctx.arc(p.x,p.y,p.size,0,Math.PI*2);
    ctx.fill();
    ctx.shadowBlur=0;

    if(p.life<=0)particles.splice(i,1);
  });
  ctx.globalAlpha=1;

  requestAnimationFrame(draw);
}
draw();

// Automatic fireworks
setInterval(()=>{
  launch();
  if(Math.random()>.5)launch();
},650);

// Touch anywhere to launch fireworks
canvas.addEventListener("pointerdown",e=>{
  launch(e.clientX,e.clientY);
});

// Sound using browser audio
function soundBurst(){
  if(!audio || !playing)return;
  const osc=audio.createOscillator();
  const gain=audio.createGain();
  osc.type="sawtooth";
  osc.frequency.setValueAtTime(100,audio.currentTime);
  osc.frequency.exponentialRampToValueAtTime(
    35,audio.currentTime+.35
  );
  gain.gain.setValueAtTime(.08,audio.currentTime);
  gain.gain.exponentialRampToValueAtTime(
    .001,audio.currentTime+.4
  );
  osc.connect(gain);
  gain.connect(audio.destination);
  osc.start();
  osc.stop(audio.currentTime+.4);
}

document.getElementById("start").onclick=()=>{
  audio=new (window.AudioContext||window.webkitAudioContext)();
  audio.resume();
  playing=true;
  document.getElementById("start").style.display="none";
  launch(W*.5,H*.5);
  launch(W*.3,H*.5);
  launch(W*.7,H*.5);
};
</script>
</body>
</html>
